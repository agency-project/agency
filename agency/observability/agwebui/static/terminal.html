<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Agency · Terminal</title>
<link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
<style>
  :root {
    --bg: #1a1a1a;
    --bg2: #222;
    --border: #3a3a3a;
    --text: #d4d4d4;
    --dim: rgba(212, 212, 212, 0.55);
    --green: #5fd75f;
    --yellow: #ffaf00;
    --red: #ff5555;
    --font: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--bg2); }
  header strong { font-family: var(--font); font-size: 13px; }
  #state { font-family: var(--font); font-size: 12px; color: var(--dim); }
  #state[data-tone="ok"] { color: var(--green); }
  #state[data-tone="warn"] { color: var(--yellow); }
  #state[data-tone="error"] { color: var(--red); }
  header .spacer { flex: 1; }
  header a, header button { color: var(--text); background: none; border: 1px solid var(--border); border-radius: 4px; padding: 3px 9px; font: inherit; cursor: pointer; text-decoration: none; }
  header button[aria-pressed="false"] { color: var(--dim); }
  main { flex: 1; display: flex; min-height: 0; }
  #terminal-pane { flex: 1 1 55%; min-width: 0; padding: 6px; background: #000; }
  #terminal { width: 100%; height: 100%; }
  #profiler-pane { flex: 1 1 45%; min-width: 0; border-left: 1px solid var(--border); }
  #profiler-pane[hidden] { display: none; }
  #profiler-pane iframe { width: 100%; height: 100%; border: 0; background: var(--bg); }
  #notice { padding: 24px; max-width: 60ch; color: var(--dim); }
  #notice code { color: var(--text); }
</style>
</head>
<body>
<header>
  <strong id="cli-label">Terminal</strong>
  <span id="state" role="status" aria-live="polite">Connecting…</span>
  <span class="spacer"></span>
  <button id="toggle-profiler" aria-pressed="true" aria-controls="profiler-pane">Live trajectory</button>
  <a href="/profiler?run=live" target="_blank" rel="noopener">Open profiler ↗</a>
</header>
<main>
  <section id="terminal-pane"><div id="terminal"></div></section>
  <section id="profiler-pane"><iframe title="Live execution trajectory" src="/profiler?run=live"></iframe></section>
</main>
<script src="/static/vendor/xterm/xterm.js"></script>
<script src="/static/vendor/xterm/addon-fit.js"></script>
<script type="module" src="/static/terminal.js"></script>
</body>
</html>
