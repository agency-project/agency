<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Web UI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <div id="left">
      <div id="shared-log-container">
        <div class="panel-title" id="shared-log-title">Shared Log<span class="badge-group"><span class="resource-badge" id="resource-stats"></span><span class="token-badge" id="global-tokens"></span></span></div>
        <div id="timeline-bar">
          <span id="timeline-from"></span>
          <input id="timeline-slider" type="range" min="0" max="0" value="0" step="1" disabled>
          <span id="timeline-to"></span>
          <button id="timeline-live-btn" class="tl-live active">LIVE</button>
        </div>
        <div id="shared-log"></div>
      </div>
      <div id="interaction">
        <div class="panel-title" id="interaction-title">No agents</div>
        <div id="agent-history"></div>
        <div id="nav-bar">
          <button id="nav-prev" title="Previous agent ([ or Shift+Tab)">&#8592;</button>
          <span id="nav-label"></span>
          <button id="nav-next" title="Next agent (] or Tab)">&#8594;</button>
        </div>
        <input id="agent-input" type="text" placeholder="type reply, then Enter…"
               autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div id="right">
      <div id="agent-tabs">
        <button class="tab-btn active" data-tab="all">All <span class="tab-count" id="count-all">0</span></button>
        <button class="tab-btn" data-tab="live">Live <span class="tab-count" id="count-live">0</span></button>
        <button class="tab-btn" data-tab="idle">Idle <span class="tab-count" id="count-idle">0</span></button>
        <button class="tab-btn" data-tab="finished">Done <span class="tab-count" id="count-finished">0</span></button>
      </div>
      <div id="agent-search-bar">
        <input id="agent-search" type="text" placeholder="Search agents…" autocomplete="off" spellcheck="false">
      </div>
      <div id="agent-list"></div>
      <div id="agent-actions">
        <button id="btn-pause-toggle" disabled>Pause</button>
        <button id="btn-pause-all">Pause All</button>
        <button id="btn-resume-all">Resume All</button>
        <button id="btn-update-config" disabled>Update Config</button>
      </div>
    </div>
  </div>
  <div id="config-modal-overlay" class="hidden">
    <div id="config-modal">
      <div class="panel-title" id="config-modal-title">Config</div>
      <div id="config-modal-body"></div>
      <div id="config-modal-actions">
        <button id="config-cancel">Cancel</button>
        <button id="config-update">Update</button>
        <button id="config-update-all">Update All</button>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
