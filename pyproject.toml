[project]
name = "agency"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "httpx",
    "html2text",
    "podman>=5.8.0",
    "textual>=8.2.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-timeout",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agency"]

[tool.pytest.ini_options]
testpaths = ["tests", "agency/common_skills"]
python_files = ["test_*.py", "*.py"]
python_functions = ["test_*"]
timeout = 120
