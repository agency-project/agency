[project]
name = "agency"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "httpx",
    "html2text",
    "pymupdf",
    "cloudpickle",
    "boto3",
    "botocore[crt]",
    "aws_bedrock_token_generator",
    "anthropic",
    "podman>=5.8.0",
    "textual>=8.2.7",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "websocket-client"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-timeout",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agency"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
timeout = 120
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
filterwarnings = [
    # ProcessPoolExecutor uses fork() on Linux. The deprecation warning fires
    # once per worker process creation and is noise in test output — the fork
    # is safe here because workers are short-lived and do no lock-protected work.
    "ignore:This process.*multi-threaded.*fork:DeprecationWarning",
]
