[project]
name = "agency"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "httpx",
    "html2text",
    "podman>=5.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-timeout",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agency"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
