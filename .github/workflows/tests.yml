name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .
          uv pip install -e ".[dev]"

      - name: Install harness CLIs
        # Standalone native-binary installers, not `npm install -g`: the npm
        # packages' JS entry points require a system Node interpreter inside
        # the sandbox image, which agency/harness/executable.py deliberately
        # does not provide (see its module docstring) -- these installers
        # ship self-contained binaries with no such runtime dependency.
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          CODEX_RELEASE=0.147.0 CODEX_NON_INTERACTIVE=true bash -c "curl -fsSL https://chatgpt.com/codex/install.sh | sh"
          # Pinned, not "latest": an unpinned install resolves its version via
          # an unauthenticated api.github.com call, which a shared Actions
          # runner IP can hit already rate-limited (60 req/hour), failing the
          # whole step with "Failed to fetch version information" independent
          # of anything in this repo.
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.31
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$HOME/.grok/bin:$PATH"
          claude --version
          codex --version
          opencode --version
          grok --version

      - name: Run pytest
        run: uv run pytest
